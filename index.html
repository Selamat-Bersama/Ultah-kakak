<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0b">
  <title>Selamat Ulang Tahun, Novi</title>
  <meta name="description" content="Untuk Novi Yulia Anggraini di hari ulang tahunnya yang ke-29 — dari Ayah, Mama, dan adik-adik.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Latar partikel emas -->
  <canvas id="dust" aria-hidden="true"></canvas>

  <!-- ====== SAMPUL ====== -->
  <section id="cover" class="cover">
    <div class="cover-inner">
      <div class="monogram" id="monogram">N</div>
      <p class="cover-to">Untuk yang tersayang</p>
      <h1 class="cover-name" id="coverName">Novi Yulia Anggraini</h1>
      <span class="rule"></span>
      <p class="cover-from">Sebuah kado kecil dari rumah<br>Ayah, Mama &amp; Adik-adik</p>
      <button id="beginBtn" class="begin-btn" aria-label="Buka">
        <span>Buka</span>
      </button>
      <p class="cover-hint">Nyalakan suara untuk pengalaman terbaik</p>
    </div>
  </section>

  <!-- ====== SLIDE (diisi otomatis dari script.js) ====== -->
  <main id="deck" class="deck" hidden></main>

  <!-- ====== KONTROL ====== -->
  <div id="hud" class="hud" hidden>
    <div class="hud-track"><i id="bar"></i></div>
    <div class="hud-bottom">
      <div class="hud-meta">
        <span id="hudChapter"></span>
        <span id="hudCount"></span>
      </div>
      <div class="hud-ctrl">
        <button id="prevBtn" class="ctl" aria-label="Sebelumnya">
          <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <button id="playBtn" class="ctl" aria-label="Jeda / lanjutkan otomatis">
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>
        </button>
        <button id="nextBtn" class="ctl" aria-label="Berikutnya">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button id="musicBtn" class="ctl music" aria-label="Putar / jeda musik">
          <span class="eq"><i></i><i></i><i></i><i></i></span>
          <span class="music-tip">Ketuk untuk memutar musik</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Pemutar musik YouTube (tersembunyi) -->
  <div class="yt-holder" aria-hidden="true"><div id="yt"></div></div>
  <audio id="bgm" loop preload="none"></audio>

  <script src="script.js"></script>
</body>
</html>
